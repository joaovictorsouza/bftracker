name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: python -m pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Subir a pilha e verificar a saúde
        run: |
          docker network inspect dokploy-network >/dev/null 2>&1 || docker network create dokploy-network
          ./scripts/setup.sh ofertas.exemplo.com admin@exemplo.com
          docker compose up -d --build --wait --wait-timeout 180
          docker compose exec -T app python -c "import json,urllib.request as u; d=json.load(u.urlopen('http://127.0.0.1:8000/api/health', timeout=5)); assert d['status']=='ok' and d['worker']"
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --tail 200
