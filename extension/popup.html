<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>BFTracker Companion</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        margin: 0;
        width: 350px;
        background: #0b0d17;
        color: #f3f4f6;
        padding: 14px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        background: linear-gradient(90deg, #8b5cf6, #ec4899);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .sub {
        margin: 0 0 12px;
        font-size: 12px;
        color: #9ca3af;
      }
      .card {
        background: #141829;
        border: 1px solid #252b45;
        border-radius: 12px;
        padding: 10px;
        margin-bottom: 10px;
      }
      label {
        display: block;
        font-size: 11px;
        color: #9ca3af;
        margin-bottom: 4px;
      }
      input[type="text"],
      input[type="password"] {
        width: 100%;
        box-sizing: border-box;
        background: #0b0d17;
        color: #f3f4f6;
        border: 1px solid #2e3656;
        border-radius: 8px;
        padding: 7px 9px;
        font-size: 12px;
        margin-bottom: 8px;
      }
      button,
      .chip {
        cursor: pointer;
        border: none;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 600;
        padding: 8px 10px;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
      }
      .btn-primary {
        width: 100%;
        background: linear-gradient(90deg, #7c3aed, #db2777);
        color: #fff;
      }
      .btn-ghost {
        background: #1e243d;
        color: #e5e7eb;
        border: 1px solid #2e3656;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }
      .status {
        font-size: 12px;
        margin: 6px 0 0;
      }
      .ok {
        color: #34d399;
      }
      .err {
        color: #fb7185;
      }
      .watch {
        padding: 7px 0;
        border-top: 1px solid #232942;
      }
      .watch:first-child {
        border-top: none;
      }
      .watch-title {
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 5px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .chip {
        padding: 4px 7px;
        font-size: 11px;
        background: #1e243d;
        color: #ddd6fe;
      }
      .chip:hover {
        background: #4c1d95;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <h1>
      <span>BF<span class="brand">Tracker</span> Companion</span>
      <a id="openApp" class="chip" href="#" target="_blank" rel="noreferrer">Abrir painel</a>
    </h1>
    <p class="sub">Mercado Livre, OLX, hardMOB e X (Twitter)</p>

    <div class="card">
      <div class="row" style="margin-bottom: 8px">
        <span style="font-size: 12px; font-weight: 600">Capturar automaticamente ao navegar</span>
        <input id="autoCapture" type="checkbox" checked />
      </div>
      <button id="captureNow" class="btn-primary">Capturar aba atual agora</button>
      <p id="captureResult" class="status"></p>
    </div>

    <div id="watchesBox" class="card" style="display: none">
      <div class="row" style="margin-bottom: 6px">
        <strong style="font-size: 12px">Atalhos Black Friday</strong>
        <div class="chips">
          <a id="xAll" class="chip" href="#" target="_blank" rel="noreferrer">🐦 X ao vivo</a>
          <a id="hardmobBtn" class="chip" href="#" target="_blank" rel="noreferrer">🔥 hardMOB</a>
        </div>
      </div>
      <div id="watchList"></div>
    </div>

    <details id="configDetails" class="card">
      <summary style="cursor: pointer; font-size: 12px; font-weight: 600">
        Conexão com o servidor
      </summary>
      <div style="margin-top: 8px">
        <label for="serverUrl">Endereço do BFTracker</label>
        <input id="serverUrl" type="text" placeholder="https://ofertas.seudominio.com" />
        <label for="apiToken">Chave pessoal (gerada em Extensão e Captura)</label>
        <input id="apiToken" type="password" placeholder="bft_..." />
        <button id="saveBtn" class="btn-ghost" style="width: 100%">Salvar e conectar</button>
        <p id="connStatus" class="status"></p>
      </div>
    </details>

    <script src="popup.js"></script>
  </body>
</html>
