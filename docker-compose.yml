name: bftracker

x-app: &app
  build: .
  image: bftracker:latest
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://bftracker:${POSTGRES_PASSWORD}@db:5432/bftracker
    DATA_DIR: /data
  volumes:
    - app-data:/data
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bftracker
      POSTGRES_DB: bftracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env (rode ./scripts/setup.sh)}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bftracker -d bftracker"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  app:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request as u,sys; sys.exit(0 if json.load(u.urlopen('http://app:8000/api/health', timeout=5))['worker'] else 1)"
      interval: 30s
      timeout: 8s
      retries: 4
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

  # WhatsApp pelo seu próprio número:  docker compose --profile whatsapp up -d
  # Não publica portas: o pareamento (QR Code) é feito pela tela do BFTracker.
  waha:
    image: ${WAHA_IMAGE:-devlikeapro/waha:latest}
    profiles: ["whatsapp"]
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WHATSAPP_DEFAULT_ENGINE: ${WAHA_ENGINE:-GOWS}
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
    volumes:
      - waha-sessions:/app/.sessions
    logging: *logging

volumes:
  db-data:
  app-data:
  caddy-data:
  caddy-config:
  waha-sessions:
